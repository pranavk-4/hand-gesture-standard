dataset:
  hf_repo_id: "cj-mills/hagrid-sample-30k-384p"
  hf_revision: "refs/convert/parquet"
  hf_filename: ["default/train/0000.parquet", "default/train/0001.parquet"]
  class_names: ["dislike", "fist", "like", "ok", "palm", "peace"]
  val_fraction: 0.15
  test_fraction: 0.15
  random_seed: 42
  data_version: "v1-6class"
  # Images pulled per class from the HaGRID sample (~1730 available/class).
  # This is the sustainability knob: bump for more signal, lower for speed.
  images_per_class: 1000

preprocessing:
  image_size: 224
  min_pixel_std: 1.0

model:
  architecture: "mobilevit_xxs"
  pretrained: true

training:
  batch_size: 32
  max_epochs: 60
  early_stopping_patience: 12
  head_lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 3
  ema_decay: 0.9
  label_smoothing_value: 0.1
  num_workers: 2
  use_amp: true
  seed: 42                # reproducible init + shuffle so runs are comparable
  grad_clip_norm: 1.0     # cap backbone grad blow-up on small data (0 = off)
  unfreeze_backbone: true
  warmup: true
  cosine_schedule: true
  class_weighted_loss: true
  label_smoothing: true
  ema: true
  differential_lr: true
  augmentation: true      # small-data regime needs augmentation ON

output:
  checkpoints_dir: "outputs/mobilevit_xxs/checkpoints"
  metrics_dir: "outputs/mobilevit_xxs/metrics"
  plots_dir: "outputs/mobilevit_xxs/plots"
